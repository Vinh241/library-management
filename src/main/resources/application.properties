spring.application.name=library-management

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.username=postgres
spring.datasource.password=rand0mPassw0rdforDB
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.library=DEBUG

jwt.secret=LibraryManagementJwtSecretKey2024VeryLongAndSecure
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# File Storage Configuration
file.upload-dir=uploads/books
file.allowed-extensions=jpg,jpeg,png,gif
file.max-file-size=10485760

# Static Resource Configuration
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.web.resources.cache.period=3600

